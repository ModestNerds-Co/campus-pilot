django-rq = "^2.10.2"
django-filter = "^24.2"
django = "^5.0.4"
django-redis = "^5.4.0"
loguru = "^0.7.2"
sentry-sdk = "^1.45.0"
boto3 = "^1.34.83"
pyjwt = "^2.8.0"
avinit = "^1.3.0"
psycopg2-binary = "^2.9.9"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

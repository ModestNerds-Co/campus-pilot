# Production override for campus.antonlabs.cc - same hostname for frontend + API
services:
  apis:
    labels:
      - traefik.enable=true
      - traefik.docker.network=media-server_default
      - traefik.http.routers.campus-api.rule=Host(`campus.antonlabs.cc`) && PathPrefix(`/api`)
      - traefik.http.routers.campus-api.entrypoints=websecure
      - traefik.http.routers.campus-api.tls.certresolver=cloudflare
      - traefik.http.routers.campus-api.priority=100
      - traefik.http.services.campus-api.loadbalancer.server.port=8000
      - traefik.http.routers.campus-api.middlewares=campus-api-stripprefix
      - traefik.http.middlewares.campus-api-stripprefix.stripprefix.prefixes=/api
    networks:
      - campus
      - media-server_default

  client:
    build:
      args:
        VITE_API_BASE_URL: https://campus.antonlabs.cc
    environment:
      VITE_API_BASE_URL: https://campus.antonlabs.cc
    labels:
      - traefik.enable=true
      - traefik.docker.network=media-server_default
      - traefik.http.routers.campus-client.rule=Host(`campus.antonlabs.cc`) && PathPrefix(`/`)
      - traefik.http.routers.campus-client.entrypoints=websecure
      - traefik.http.routers.campus-client.tls.certresolver=cloudflare
      - traefik.http.routers.campus-client.priority=1
      - traefik.http.services.campus-client.loadbalancer.server.port=80
    networks:
      - campus
      - media-server_default

networks:
  campus:
    name: campus-pilot
  media-server_default:
    external: true

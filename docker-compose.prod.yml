# Production override for campus.antonlabs.cc
services:
  apis:
    labels:
      - traefik.enable=true
      - traefik.http.routers.campus-api.rule=Host(`campus.antonlabs.cc`) && PathPrefix(`/api`)
      - traefik.http.routers.campus-api.entrypoints=websecure
      - traefik.http.routers.campus-api.tls.certresolver=cloudflare
      - traefik.http.services.campus-api.loadbalancer.server.port=8000
      - traefik.http.routers.campus-api.middlewares=campus-api-stripprefix
      - traefik.http.middlewares.campus-api-stripprefix.stripprefix.prefixes=/api
    networks:
      - campus
      - media-server_default

  client:
    labels:
      - traefik.enable=true
      - traefik.http.routers.campus.rule=Host(`campus.antonlabs.cc`)
      - traefik.http.routers.campus.entrypoints=websecure
      - traefik.http.routers.campus.tls.certresolver=cloudflare
      - traefik.http.services.campus.loadbalancer.server.port=80
    networks:
      - campus
      - media-server_default

networks:
  campus:
    name: campus-pilot
  media-server_default:
    external: true

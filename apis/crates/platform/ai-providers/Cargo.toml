[package]
name = "cp-ai-providers"
version = "0.1.0"
edition = "2024"

[dependencies]
cp-audit = { path = "../audit" }
cp-common = { path = "../../common" }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }

aes-gcm = "0.10"
base64 = "0.21"
reqwest = { version = "0.12.20", default-features = false, features = ["json", "rustls-tls"] }
secrecy = "0.10"
thiserror = "2"

[dev-dependencies]
httpmock = "0.7"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread"] }

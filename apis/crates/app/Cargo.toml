[package]
name = "campus-pilot"
version = "1.0.0"
edition = "2024"

[dependencies]
cp-common = { path = "../common" }
cp-audit = { path = "../platform/audit" }
cp-ai-providers = { path = "../platform/ai-providers" }
cp-agent-runtime = { path = "../platform/agent-runtime" }
cp-agent = { path = "../agent" }
cp-fleet = { path = "../modules/fleet" }
cp-vehicle-log = { path = "../modules/vehicle-log" }
cp-sis = { path = "../modules/sis" }
cp-academics = { path = "../modules/academics" }
cp-finance = { path = "../modules/finance" }
cp-fees = { path = "../modules/fees" }
cp-hr-payroll = { path = "../modules/hr-payroll" }
cp-procurement = { path = "../modules/procurement" }
cp-assets-inventory = { path = "../modules/assets-inventory" }
cp-library = { path = "../modules/library" }
cp-messaging = { path = "../modules/messaging" }
cp-hostel = { path = "../modules/hostel" }
cp-health = { path = "../modules/health" }
cp-timetabling = { path = "../modules/timetabling" }
cp-attendance = { path = "../modules/attendance" }
cp-gradebook = { path = "../modules/gradebook" }
cp-academic-reporting = { path = "../modules/academic-reporting" }
cp-document-registry = { path = "../modules/document-registry" }
cp-internal-audit = { path = "../modules/internal-audit" }
cp-learning = { path = "../modules/learning" }
cp-student-support = { path = "../modules/student-support" }
cp-transport = { path = "../modules/transport" }
cp-facilities = { path = "../modules/facilities" }
cp-activities = { path = "../modules/activities" }

sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
anyhow = { workspace = true }
actix-web = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
validator = { workspace = true }
log = { workspace = true }
semver = { workspace = true }

dotenv = "0.15"
env_logger = "0.11.8"
regex = "1.11.1"
nanoid = "0.4"
futures = "0.3.31"
actix-multipart = "0.7"
tokio = { version = "1.45.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1.88"
reqwest = { version = "0.12.20", features = ["json"] }
actix-governor = "0.3"
rust_decimal = "1.33"
actix-cors = "0.7.1"
lettre = "0.11.17"
base64 = "0.21"
sha2 = "0.10"
urlencoding = "2.1.3"
sentry = { version = "0.43.0", features = ["logs", "log"] }
sentry-actix = "0.43.0"
aws-config = { version = "1.0", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.0"
aws-credential-types = "1.0"
argon2 = "0.5"
jsonwebtoken = "9.3"
futures-util = "0.3.31"
url = "2.5"
aes-gcm = "0.10"
getrandom = "0.3"

[dev-dependencies]
tokio = { version = "1.45.1", features = ["rt-multi-thread", "macros"] }
